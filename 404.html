<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halaman tidak ditemukan — Vylonium</title>
<meta name="description" content="Halaman yang kamu cari tidak ditemukan.">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='48' cy='48' r='48' fill='%23f2f2f4'/%3E%3Crect x='-6.5' y='-24' width='13' height='48' rx='6.5' fill='%230e0e10' transform='translate(38.5 48) rotate(-22)'/%3E%3Crect x='-6.5' y='-24' width='13' height='48' rx='6.5' fill='%230e0e10' fill-opacity='.55' transform='translate(57.5 48) rotate(22)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap">
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --mut: #71717a;
  --line: #e5e7eb;
  --font-display: "Montserrat", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e10;
    --fg: #f2f2f4;
    --mut: #8d8d96;
    --line: #2e2e34;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
}
main { width: 100%; max-width: 440px; text-align: center; }

/* Angka 404: tiap digit jatuh bergantian, lalu angka 0 melayang pelan */
.code {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: clamp(96px, 30vw, 152px);
  font-weight: 800;
  letter-spacing: -.05em;
  line-height: 1;
}
.code > span { display: inline-block; opacity: 0; animation: drop .7s cubic-bezier(.2,.9,.25,1.2) forwards; }
.code > span:nth-child(1) { animation-delay: .05s; }
.code > span:nth-child(2) { animation-delay: .2s; }
.code > span:nth-child(3) { animation-delay: .35s; }
.code .o { position: relative; color: var(--line); }
.code .o i { display: inline-block; font-style: normal; animation: bob 3.2s ease-in-out 1.1s infinite; }
.shadow {
  width: clamp(60px, 18vw, 90px);
  height: 8px;
  margin: 10px auto 0;
  border-radius: 50%;
  background: var(--fg);
  opacity: 0;
  filter: blur(6px);
  animation: shade 3.2s ease-in-out 1.1s infinite, fade .5s ease .9s forwards;
}
@keyframes drop {
  0% { opacity: 0; transform: translateY(-48px) scale(.9); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
@keyframes shade { 0%, 100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.7); opacity: .08; } }
@keyframes fade { to { opacity: .16; } }

h1, p { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
h1 {
  margin-top: 28px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.3;
  animation-delay: .6s;
}
p {
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--mut);
  text-wrap: pretty;
  animation-delay: .75s;
}
/* Logo besar menempel di latar, terpotong di sudut kanan bawah */
.bg-logo {
  position: fixed;
  right: -14vmin;
  bottom: -16vmin;
  z-index: 0;
  width: min(130vmin, 760px);
  height: auto;
  color: var(--fg);
  opacity: 0;
  pointer-events: none;
  animation: logo-in 1.2s ease .1s forwards, logo-drift 14s ease-in-out 1.3s infinite alternate;
}
@keyframes logo-in { to { opacity: .05; } }
@keyframes logo-drift { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-2vmin, -2vmin) rotate(3deg); } }
main { position: relative; z-index: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .code > span, h1, p { animation: none; opacity: 1; transform: none; }
  .code .o i, .shadow { animation: none; }
  .bg-logo { animation: none; opacity: .05; }
  .shadow { opacity: .12; }
}
</style>
</head>
<body>
<svg class="bg-logo" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
  <rect x="-6.5" y="-24" width="13" height="48" rx="6.5" fill="currentColor" transform="translate(38.5 48) rotate(-22)"/>
  <rect x="-6.5" y="-24" width="13" height="48" rx="6.5" fill="currentColor" fill-opacity=".55" transform="translate(57.5 48) rotate(22)"/>
</svg>
<main>
  <div class="code" aria-hidden="true"><span>4</span><span class="o"><i>0</i></span><span>4</span></div>
  <div class="shadow" aria-hidden="true"></div>
  <h1>Halaman tidak ditemukan</h1>
  <p>Alamat yang kamu buka tidak ada atau sudah dipindahkan.</p>
</main>
</body>
</html>
