  --pill-sh-h: 0 2px 4px rgba(0,0,0,.5), 0 10px 24px rgba(0,0,0,.45);
  --tile: #2a2a31;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
  padding-block: 48px calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

a { color: inherit; text-decoration: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
:focus { outline: none; }
a:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.bg-logo {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(92vw, 560px);
  aspect-ratio: 1;
  z-index: 0;
  opacity: 0.05;
  pointer-events: none;
  user-select: none;
}
.bg-logo svg { display: block; width: 100%; height: 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bg-logo { opacity: 0.06; } }
:root[data-theme="dark"] .bg-logo { opacity: 0.06; }
main { position: relative; z-index: 1; }

main {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  animation: vin 0.22s cubic-bezier(0.2, 0.7, 0.2, 1);
}
@keyframes vin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  min-width: 0;
}
.avatar {
  width: 96px;
  height: 96px;
  margin-bottom: 10px;
}
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 9999px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.15;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.handle { font-size: 14px; color: var(--mut); }
.bio {
  max-width: 36ch;
  margin-top: 6px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--mut);
  text-wrap: pretty;
}

.socials {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}
.ib {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 9999px;
  color: var(--fg);
  transition: background-color 0.15s, transform 0.12s;
}
@media (hover: hover) { .ib:hover { background: var(--hov); } }
.ic.brand { fill: none; stroke: none; }
.ib:active { transform: scale(0.95); }
.ic {
  display: block;
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pills { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.pill {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 64px;
  padding: 10px 12px;
  border-radius: 9999px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-bd);
  box-shadow: var(--pill-sh);
  color: var(--fg);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
@media (hover: hover) { .pill:hover { transform: translateY(-2px); box-shadow: var(--pill-sh-h); } }
.pill:active { transform: scale(0.985); box-shadow: var(--pill-sh); }
.pill > .ic:first-child {
  flex: none;
  width: 40px;
  height: 40px;
  padding: 10px;
  border-radius: 50%;
  background: var(--tile);
  color: var(--fg);
}
.pill .logo { flex: none; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 1px var(--pill-bd); }
.pill::after { content: ""; flex: none; width: 40px; }
.pill-t { flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; overflow-wrap: anywhere; }
footer {
  margin-top: 40px;
  text-align: center;
  font-size: 12px;
  color: var(--mut);
}

@media (prefers-reduced-motion: reduce) {
  main { animation: none; }
  .ib, .pill { transition: none; }
}
</style>
