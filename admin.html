<style>
:root{
  --bg:#ffffff;--fg:#111111;--mut:#71717a;--card:#f4f4f5;--card2:#ececee;--line:#e5e7eb;--hov:#f4f4f6;
  --tile:#f1f1f4;--ok:#16a34a;--err:#dc2626;
  --pill-sh-h:0 2px 4px rgba(17,17,24,.06),0 10px 24px rgba(17,17,24,.10);
  --font-display:"Montserrat",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e10;--fg:#f2f2f4;--mut:#8d8d96;--card:#202025;--card2:#2a2a30;--line:#2e2e34;--hov:#222227;
    --tile:#2a2a31;--ok:#4ade80;--err:#f87171;
    --pill-sh-h:0 2px 4px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e10;--fg:#f2f2f4;--mut:#8d8d96;--card:#202025;--card2:#2a2a30;--line:#2e2e34;--hov:#222227;
  --tile:#2a2a31;--ok:#4ade80;--err:#f87171;
  --pill-sh-h:0 2px 4px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;min-height:100%;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.input:focus-visible{outline:none}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;animation:vin .22s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.avatar{width:72px;height:72px;margin-bottom:6px}
.avatar svg{width:100%;height:100%;display:block}
h1{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.03em}
.sub{font-size:14px;color:var(--mut);max-width:42ch;text-wrap:pretty}

.tabs{display:flex;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:44px;padding:12px 14px;margin-bottom:-1px;background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:15px;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
@media (hover:hover){.tab:hover{color:var(--fg)}}

.label{margin:28px 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.hint{margin-top:6px;font-size:13px;color:var(--mut);text-wrap:pretty}
.field{display:block;margin-top:12px}
.field>span{display:block;margin-bottom:6px;font-size:13px;color:var(--mut)}
.input{width:100%;min-height:52px;padding:12px 18px;border:1px solid var(--line);border-radius:18px;background:var(--tile);color:var(--fg);font:inherit;font-size:16px;transition:border-color .15s}
.input::placeholder{color:var(--mut)}
.input:focus{border-color:var(--fg)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;min-height:160px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.item{margin-top:12px;padding:16px;background:var(--card);border-radius:22px}
.item-h{display:flex;align-items:center;gap:10px}
.item-h b{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px}
.ib{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--fg);cursor:pointer;transition:background-color .15s,transform .12s}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.ib:hover{background:var(--card2)}}
.ib:active{transform:scale(.92)}
.ib.danger{color:var(--err)}
.ib:disabled{opacity:.3;cursor:default}
.thumb{width:100%;aspect-ratio:16/9;margin-top:12px;border-radius:14px;overflow:hidden;background:var(--tile);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
details{margin-top:12px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}

.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;margin-top:14px;border:0;border-radius:9999px;background:var(--fg);color:var(--bg);font:inherit;font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s,opacity .15s}
.go:active{transform:scale(.98)}
.go.ghost{background:var(--tile);color:var(--fg)}
.go.sm{min-height:46px;font-size:15px}
.go:disabled{opacity:.5;cursor:default}
@media (hover:hover){.go:not(:disabled):hover{opacity:.88}}
.row{display:flex;gap:10px}.row>*{flex:1 1 0;min-width:0}
@media (max-width:520px){.row.wrap{flex-direction:column;gap:0}}

.amts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.amt{display:flex;align-items:center;gap:2px;padding:0 4px 0 16px;border-radius:9999px;background:var(--tile)}
.amt input{width:90px;min-height:42px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.amt .ib{width:34px;height:34px}

.empty{margin-top:24px;padding:28px 20px;border-radius:22px;background:var(--card);text-align:center}
.empty h2{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.empty p{margin-top:6px;font-size:14px;color:var(--mut)}
.steps{list-style:none;padding:0;counter-reset:st;display:grid;gap:12px;margin-top:10px}
.steps li{position:relative;padding-left:36px;counter-increment:st;font-size:14px;color:var(--mut)}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps strong{color:var(--fg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 20px;border-radius:9999px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){main{animation:none}.ib,.go,.toast{transition:none}}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-left:8px;vertical-align:middle}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mut)}
.chk input{width:18px;height:18px;accent-color:var(--fg)}
.go.danger{background:transparent;color:var(--err);border:1px solid var(--line)}

/* ---- tidy ---- */
body{padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
main{max-width:640px}
.top{align-items:flex-start;text-align:left;gap:4px}
h1{font-size:24px}
.sub{max-width:none;font-size:14px}
.tabs[hidden]{display:none}
.tabs{margin-top:20px;padding:4px;gap:4px;border:0;background:var(--tile);border-radius:9999px;overflow:visible}
.tab{flex:1 1 0;min-height:40px;padding:8px 10px;margin:0;border:0;border-radius:9999px;font-size:14px;text-align:center}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{margin:24px 0 4px;font-size:11.5px}
.field{margin-top:14px}
.field>span{font-size:12.5px;font-weight:500;margin-bottom:6px}
.input{min-height:48px;padding:11px 16px;border-radius:14px;background:var(--bg)}
textarea.input{min-height:88px}
.item{margin-top:14px;padding:16px 16px 18px;background:var(--card);border-radius:20px}
.item .input{background:var(--bg)}
.item-h{padding-bottom:12px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.item-h b{font-size:15px}
.tools{gap:2px}
.ib{width:36px;height:36px}
.ib svg{width:18px;height:18px}
.thumb{margin-top:14px;border-radius:12px}
.item .go{margin-top:18px}
.go{min-height:50px;font-size:15px;margin-top:16px}
.go.sm{min-height:46px}
.go.danger{background:transparent}
.empty{margin-top:14px;padding:22px 16px;border-radius:20px}
.empty p{margin:0}
.hint{font-size:12.5px;margin-top:8px}
footer{margin-top:32px}
@media (min-width:521px){
  .go.ghost.sm,.go.danger.sm{width:auto;padding:0 22px}
  .item .go,.go:not(.sm):not(.ghost){width:auto;padding:0 28px}
  .item .go{margin-left:auto;display:flex}
}

/* ---- login & footer ---- */
html{height:100%}
body{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
main{width:100%;flex:1 0 auto;min-height:0;display:flex;flex-direction:column}
footer{margin-top:auto;padding-top:28px}
body.login .top{display:none}
body.login #app{margin-top:auto}
.field>span:empty{display:none}
.brand{margin-bottom:26px;text-align:center;font-family:"Pirata One","Old English Text MT",Georgia,serif;font-size:54px;line-height:1.1;letter-spacing:.02em;color:var(--fg);
  --ex:#8d8d96;
  text-shadow:1px 1px 0 var(--ex),2px 2px 0 var(--ex),3px 3px 0 var(--ex),4px 4px 0 var(--ex),5px 5px 0 var(--ex),6px 6px 0 var(--ex),7px 7px 8px rgba(0,0,0,.45),10px 12px 18px rgba(0,0,0,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .brand{--ex:#b4b4bc;text-shadow:1px 1px 0 var(--ex),2px 2px 0 var(--ex),3px 3px 0 var(--ex),4px 4px 0 var(--ex),5px 5px 0 var(--ex),6px 6px 0 var(--ex),7px 7px 8px rgba(0,0,0,.25),10px 12px 18px rgba(0,0,0,.18)}}
/* ---- input kapsul ---- */
input.input,select.input{border-radius:9999px;padding-left:22px;padding-right:22px}
select.input{padding-right:44px;background-position:calc(100% - 26px) 50%,calc(100% - 20px) 50%}
textarea.input{border-radius:22px}
.pw{position:relative}
.pw .input{padding-right:54px}
.eye{position:absolute;right:6px;bottom:4px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--mut);cursor:pointer;transition:color .15s,background-color .15s}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye:active{background:var(--card2)}
@media (hover:hover){.eye:hover{color:var(--fg)}}
.go-login{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:21px;letter-spacing:.05em}
.go.go-login{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:608px;width:auto;z-index:20;box-shadow:var(--pill-sh-h)}
body.login footer{order:0;margin-top:20px;padding-top:0;margin-bottom:auto}
body:not(.login) footer{display:none}
.pills { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.pill {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 64px;
  padding: 10px 12px;
  border-radius: 9999px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-bd);
  box-shadow: var(--pill-sh);
  color: var(--fg);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
@media (hover: hover) { .pill:hover { transform: translateY(-2px); box-shadow: var(--pill-sh-h); } }
.pill:active { transform: scale(0.985); box-shadow: var(--pill-sh); }
.pill > .ic:first-child {
  flex: none;
  width: 40px;
  height: 40px;
  padding: 10px;
  border-radius: 50%;
  background: var(--tile);
  color: var(--fg);
}
.pill {
  padding: 7px;
  min-height: 64px;
  background: var(--tile);
  border-color: transparent;
  box-shadow: none;
}
@media (hover: hover) { .pill:hover { box-shadow: var(--pill-sh-h); } }
.pill-t { text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; font-size: 15px; }
.pill::after { content: ""; flex: none; width: 52px; }
/* Logo: tetap putih, dengan cincin gradasi warna-warni */
.pill .logo {
  flex: none;
  width: 52px;
  height: 52px;
  padding: 2px;
  box-sizing: border-box;
  border-radius: 50%;
  background: linear-gradient(var(--a, 135deg), #3b82f6 0%, #8b5cf6 33%, #ec4899 66%, #f59e0b 100%);
  box-shadow: 0 4px 12px -3px rgba(236, 72, 153, 0.45);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (hover: hover) { .pill:hover .logo { transform: rotate(-8deg) scale(1.08); } }
.pill:active .logo { transform: scale(0.94); }
.pill-row:nth-child(2) .logo { --a: 225deg; }
.pill-row:nth-child(3) .logo { --a: 315deg; }
.pill-t { flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; overflow-wrap: anywhere; }

.tabs {
  display: flex;
  margin-top: 24px;
  border-bottom: 1px solid var(--line);
}
.tab {
  flex: 1;
  min-height: 44px;
  padding: 12px 8px;
  margin-bottom: -1px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--mut);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }
@media (hover: hover) { .tab:hover { color: var(--fg); } }
#panel-proyek .pills { margin-top: 20px; }
.gallery { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
.shot { aspect-ratio: 16 / 9; margin: 0; border-radius: 16px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

.shot { position: relative; display: block; color: #fff; text-decoration: none; }
.shot img { transition: transform 0.5s ease; }
.shot::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0)); pointer-events: none; }
.shot-name { position: absolute; z-index: 1; left: 16px; bottom: 16px; right: 130px; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; text-shadow: 0 1px 6px rgba(0,0,0,0.5); }
.shot-cta { position: absolute; z-index: 1; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px 8px 14px; border-radius: 9999px; background: #ffffff; color: #111; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.25); transition: transform 0.2s ease; }
.shot-cta svg { width: 14px; height: 14px; }
@media (hover: hover) { .shot:hover img { transform: scale(1.03); } .shot:hover .shot-cta { transform: translate(2px, -2px); } }
.shot:active .shot-cta { transform: scale(0.95); }

</style>

<script>

(function () {

        var d = c.toDataURL('image/webp', q); if (d.indexOf('data:image/webp') !== 0) d = c.toDataURL('image/jpeg', q);
        res(d);
      };
      im.src = u;
    });
  }
  var picker = document.createElement('input'); picker.type = 'file'; picker.accept = 'image/*'; picker.hidden = true; document.body.appendChild(picker);
  function pick(o, cb) {
    picker.value = '';
    picker.onchange = function () { var f = picker.files[0]; if (f) shrink(f, o[0], o[1], o[2]).then(cb, function (e) { toast(e.message); }); };
    picker.click();
  }

  function field(label, path, o) {
    o = o || {};
    var v = getv(path), inner;
    if (o.select) {
      inner = '<select class="input" data-path="' + path + '">' + o.select.map(function (x) {
        return '<option value="' + x[0] + '"' + (String(v) === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
      }).join('') + '</select>';
    } else if (o.rows) {
      inner = '<textarea class="input" data-path="' + path + '" rows="' + o.rows + '" placeholder="' + esc(o.ph || '') + '">' + esc(v) + '</textarea>';
    } else {
      inner = '<input class="input" data-path="' + path + '"' + (o.type ? ' type="' + o.type + '"' : '') + ' value="' + esc(v) + '" placeholder="' + esc(o.ph || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false">';
    }
    return '<label class="field"><span>' + label + '</span>' + inner + '</label>' + (o.hint ? '<p class="hint">' + o.hint + '</p>' : '');
  }

  function initial(t) { return esc((t || '?').trim().charAt(0).toUpperCase() || '?'); }
  function logoEl(it) { return '<span class="logo">' + (it.logo ? '<img src="' + esc(it.logo) + '" alt="">' : '<b>' + initial(it.title) + '</b>') + '</span>'; }
  function urlField(label, path) {
    var v = getv(path) || '';
    return '<label class="field"><span>' + label + '</span><input class="input" data-path="' + path + '" value="' + esc(/^data:/.test(v) ? '' : v) + '" placeholder="' + (/^data:/.test(v) ? '(gambar terunggah)' : 'https://') + '" autocomplete="off" autocapitalize="off" spellcheck="false"></label>';
  }
  function oldMissing() {
    var h = function (a, u) { return a.some(function (x) { return String(x.url || '').replace(/\/+$/, '') === u.replace(/\/+$/, ''); }); };
    return OLD.links.some(function (l) { return !h(S.links, l.url); }) || OLD.portfolio.some(function (l) { return !h(S.portfolio, l.url); });
  }
  function login() {
    return '<div class="brand">Vylonium</div>' +
      '<div class="pw">' + field('', 'token', { type: 'password', ph: 'Password' }) +
      '<button class="eye" type="button" data-act="eye" aria-label="Tampilkan password">' + ICON.eye + '</button></div>' +
      '<label class="chk"><input type="checkbox" id="remember"' + (S.remember ? ' checked' : '') + '> Ingat token di perangkat ini</label>' +
      '<button class="go go-login" type="button" data-act="login"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Memeriksa…' : 'Konfirmasi') + '</button>';
  }
  function akun() {
    var d = S.busy ? ' disabled' : '';
    return '<p class="label">Data lama dari index</p>' +
      '<button class="go ghost sm" type="button" data-act="import-old"' + d + '>Daftarkan data lama ke Workers</button>' +
      '<p class="hint">Mengirim 3 proyek, 10 karya, dan profil dari index.html ke server. Yang tautannya sudah ada tidak dobel.</p>' +
      '<p class="label">Sinkronisasi</p>' +
      '<button class="go ghost sm" type="button" data-act="reload"' + d + '>Muat ulang dari server</button>' +
      '<button class="go ghost sm" type="button" data-act="push-all"' + d + '>Kirim semua sekaligus (PUT /admin/content)</button>' +
      '<p class="hint">Kirim semua akan menimpa settings, links, dan portfolio di server dengan isi panel ini.</p>' +
      '<p class="label">Cadangan</p><button class="go ghost sm" type="button" data-act="dl-json">Unduh cadangan (.json)</button>' +
      '<p class="label">Sesi</p><button class="go danger sm" type="button" data-act="logout">Keluar</button>';
  }
  function home() {
    var s = S.settings, d = S.busy ? ' disabled' : '';
    var h = '<header class="profile"><button class="edit-top" type="button" data-act="edit-profile">Edit</button>' +
      '<div class="avatar">' + (s.avatar ? '<img src="' + esc(s.avatar) + '" alt="">' : DEFAV) + '<button class="pen" type="button" data-act="pick-avatar" aria-label="Ganti logo"' + d + '>' + ICON.pen + '</button></div>' +
      '<h1>' + esc(s.title || 'Vylonium') + VERIFIED + '</h1><p class="handle">' + esc(s.handle || '@vylonium') + '</p><p class="bio">' + esc(s.bio) + '</p>' + SOCIALS + '</header>';
    h += '<div class="tabs" role="tablist">' + TABS.map(function (t) {
      return '<button class="tab" role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var note = S.loaded && S.tab !== 'akun' && oldMissing() ? '<div class="note">Data lama dari index belum terdaftar di server, jadi belum bisa diedit di sini.<br><button class="go ghost sm" type="button" data-act="import-old"' + d + '>Daftarkan sekarang</button></div>' : '';
    if (S.tab === 'links') {
      h += '<section id="panel-proyek">' + note + '<div class="pills">' + S.links.map(function (it, i) {
        return '<div class="pill-row"><div class="pill" role="button" tabindex="0" data-act="edit" data-list="links" data-i="' + i + '">' + logoEl(it) + '<span class="pill-t">' + esc(it.title || 'Tanpa judul') + '</span></div><span class="rowpen">' + ICON.pen + '</span></div>';
      }).join('') + '</div><button class="go ghost sm addb" type="button" data-act="add" data-list="links"' + d + '>' + ICON.plus + ' Tambah link</button></section>';
    } else if (S.tab === 'portfolio') {
      h += '<section id="panel-karya">' + note + '<div class="gallery">' + S.portfolio.map(function (it, i) {
        return '<div class="shot" role="button" tabindex="0" data-act="edit" data-list="portfolio" data-i="' + i + '">' + (it.image ? '<img src="' + esc(it.image) + '" alt="" onerror="this.style.display=\'none\'">' : '') + '<span class="shot-name">' + esc(it.title || 'Tanpa judul') + '</span><span class="shot-cta">Edit ' + ICON.pen + '</span></div>';
      }).join('') + '</div><button class="go ghost sm addb" type="button" data-act="add" data-list="portfolio"' + d + '>' + ICON.plus + ' Tambah karya</button></section>';
    } else h += akun();
    return h;
  }
  function page(title, inner) {
    return '<div class="pg"><div class="pg-h"><button class="ib" type="button" data-act="back" aria-label="Kembali">' + ICON.back + '</button><h2>' + title + '</h2></div>' + inner + '</div>';
  }
  function profilePage() {
    var p = S.pf, d = S.busy ? ' disabled' : '';
    return page('Edit profil',
      '<div class="up"><div class="ava">' + (p.avatar ? '<img src="' + esc(p.avatar) + '" alt="">' : DEFAV) + '</div><div class="btns">' +
      '<button class="go ghost sm" type="button" data-act="up-av">Ganti logo</button>' + (p.avatar ? '<button class="go danger sm" type="button" data-act="clr-av">Hapus logo</button>' : '') + '</div></div>' +
      field('Nama', 'pf.title') + field('Username', 'pf.handle', { ph: '@vylonium' }) + field('Deskripsi (bio)', 'pf.bio', { rows: 3 }) +
      field('Tema', 'pf.theme', { select: [['dark', 'Gelap'], ['light', 'Terang']] }) +
      '<button class="go" type="button" data-act="save-profile"' + d + '>Simpan</button>');
  }
  function formPage() {
    var f = S.form, dr = f.d, L = f.list === 'links', n = S[f.list].length + (f.i == null ? 1 : 0), d = S.busy ? ' disabled' : '', k = L ? 'logo' : 'image', has = !!dr[k];
    var pos = []; for (var i = 1; i <= n; i++) pos.push([String(i), String(i)]);
    var up = L
      ? '<div class="up">' + logoEl(dr) + '<div class="btns"><button class="go ghost sm" type="button" data-act="up">Unggah logo</button>' + (has ? '<button class="go danger sm" type="button" data-act="clr">Hapus logo</button>' : '') + '</div></div>'
      : '<div class="up-img"><div class="shot">' + (has ? '<img src="' + esc(dr.image) + '" alt="">' : 'Belum ada gambar') + '</div><div class="btns"><button class="go ghost sm" type="button" data-act="up">Unggah gambar</button>' + (has ? '<button class="go danger sm" type="button" data-act="clr">Hapus</button>' : '') + '</div></div>';
    return page((f.i == null ? 'Tambah ' : 'Edit ') + (L ? 'link' : 'karya'),
      up + field('Judul', 'form.d.title') + field('Tautan', 'form.d.url', { ph: 'https://' }) +
      urlField(L ? 'Atau tempel URL logo' : 'Atau tempel URL gambar', 'form.d.' + k) +
      field('Posisi', 'form.d.pos', { select: pos }) +
      '<button class="go" type="button" data-act="save-form"' + d + '>' + (f.i == null ? 'Tambahkan' : 'Simpan perubahan') + '</button>' +
      (f.i == null ? '' : '<button class="go danger sm" type="button" data-act="del-form"' + d + '>Hapus</button>'));
  }
  function render() {
    if (!S.token) S.tab = 'akun';
    document.body.classList.toggle('login', !S.token);
    var y = window.scrollY;
    $('app').innerHTML = !S.token ? login() : S.view === 'form' && S.form ? formPage() : S.view === 'profile' && S.pf ? profilePage() : home();
    window.scrollTo(0, y);
  }
  function nav(v) { S.view = v; try { history.pushState({ v: v }, ''); } catch (e) {} render(); window.scrollTo(0, 0); }
  function leave() { S.view = 'home'; S.form = null; S.pf = null; try { if (history.state && history.state.v) history.back(); } catch (e) {} }
  window.addEventListener('popstate', function () { if (S.view !== 'home') { S.view = 'home'; S.form = null; S.pf = null; render(); } });
  function setBody() { var s = S.pf || S.settings; return { title: s.title, bio: s.bio, handle: s.handle, avatar: s.avatar, theme: s.theme }; }

  /* ---------- Events ---------- */
  $('app').addEventListener('input', function (e) {
    var p = e.target.getAttribute('data-path'); if (p) setv(p, e.target.value);
  });
  $('app').addEventListener('change', function (e) {
    var el = e.target, p = el.getAttribute('data-path');
    if (el.id === 'remember') S.remember = el.checked;
    else if (el.tagName === 'SELECT') setv(p, el.value);
    else if (p && /\.(logo|image)$/.test(p)) render();
  });
  $('app').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
  });
  function download(text, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function clean(a, list) { return a.map(function (it, i) { return Object.assign({ id: it.id }, body(list, it, i)); }); }


  $('app').addEventListener('click', function (e) {
    var tb = e.target.closest('[data-tab]');
    if (tb) { S.tab = tb.getAttribute('data-tab'); render(); return; }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), list = b.getAttribute('data-list'), i = Number(b.getAttribute('data-i'));

    if (act === 'import-old') {
      run(async function () {
        var have = function (arr, u) { return arr.some(function (x) { return String(x.url || '').replace(/\/+$/, '') === u.replace(/\/+$/, ''); }); };
        for (var a = 0; a < OLD.links.length; a++) { var l = OLD.links[a]; if (have(S.links, l.url)) continue; await api('POST', '/admin/links', { title: l.title, url: l.url, logo: '', order: S.links.length + 1 }); S.links.push(Object.assign({ id: -1 }, l)); }
        for (var c = 0; c < OLD.portfolio.length; c++) { var p = OLD.portfolio[c]; if (have(S.portfolio, p.url)) continue; await api('POST', '/admin/portfolio', { title: p.title, image: p.image, url: p.url, order: S.portfolio.length + 1 }); S.portfolio.push(Object.assign({ id: -1 }, p)); }
        if (!S.settings.title && !S.settings.bio) await api('PUT', '/admin/settings', Object.assign(setBody(), { title: OLD.settings.title, bio: OLD.settings.bio }));
        await load(false);
      }, 'Data lama terdaftar');
    }
    else if (act === 'eye') {
      var inp = $('app').querySelector('input[data-path="token"]'); if (!inp) return;
      var show = inp.type === 'password'; inp.type = show ? 'text' : 'password';
      b.innerHTML = show ? ICON.eyeoff : ICON.eye;
    }
    else if (act === 'login') {
      S.base = cleanBase(S.base) || DEFAULT_BASE; S.token = String(S.token).trim();
      if (!S.token) { toast('Isi token dulu'); return; }
      run(async function () {
        try { await load(false); }
        catch (er) { if (er.auth) { S.token = ''; throw new Error('Token salah'); } S.loaded = false; throw er; }
        store(K_TOKEN, S.token, S.remember); store(K_BASE, S.base, S.remember); S.tab = 'links'; S.view = 'home';
      }, 'Berhasil masuk');
    }
    else if (act === 'logout') { clearToken(); S.tab = 'akun'; S.view = 'home'; render(); toast('Sudah keluar'); }
    else if (act === 'reload') run(function () { return load(false); }, 'Data dimuat ulang');
    else if (act === 'edit-profile') { S.pf = Object.assign({}, S.settings); nav('profile'); }
    else if (act === 'pick-avatar') pick(AVATAR, function (dt) {
      run(async function () {
        var old = S.settings.avatar; S.settings.avatar = dt;
        try { await api('PUT', '/admin/settings', setBody()); } catch (er) { S.settings.avatar = old; throw er; }
      }, 'Logo diganti');
    });
    else if (act === 'up-av') pick(AVATAR, function (dt) { S.pf.avatar = dt; render(); });
    else if (act === 'clr-av') { S.pf.avatar = ''; render(); }
    else if (act === 'save-profile') run(async function () {
      await api('PUT', '/admin/settings', setBody()); S.settings = Object.assign({}, S.pf); leave();
    }, 'Profil disimpan');
    else if (act === 'add') { S.form = { list: list, i: null, d: { title: '', url: 'https://', logo: '', image: '', pos: String(S[list].length + 1) } }; nav('form'); }
    else if (act === 'edit') {
      var it = S[list][i]; S.form = { list: list, i: i, d: { title: it.title || '', url: it.url || '', logo: it.logo || '', image: it.image || '', pos: String(i + 1) } }; nav('form');
    }
    else if (act === 'back') { try { history.back(); } catch (er) { leave(); render(); } }
    else if (act === 'up') pick(S.form.list === 'links' ? LOGO : IMG, function (dt) { S.form.d[S.form.list === 'links' ? 'logo' : 'image'] = dt; render(); });
    else if (act === 'clr') { S.form.d[S.form.list === 'links' ? 'logo' : 'image'] = ''; render(); }
    else if (act === 'save-form') {
      var f = S.form, dr = f.d;
      if (!String(dr.title).trim() || !String(dr.url).trim()) { toast('Judul dan tautan wajib diisi'); return; }
      run(async function () {
        var ls = f.list, arr = S[ls].slice(), max = arr.length + (f.i == null ? 1 : 0);
        var pos = Math.max(1, Math.min(max, Number(dr.pos) || max)) - 1;
        var item = Object.assign({}, f.i == null ? {} : arr[f.i], { title: dr.title.trim(), url: dr.url.trim(), logo: dr.logo || '', image: dr.image || '' });
        if (f.i != null) arr.splice(f.i, 1);
        arr.splice(pos, 0, item);
        if (item.id != null) await api('PUT', '/admin/' + ls + '/' + encodeURIComponent(item.id), body(ls, item, pos));
        else await api('POST', '/admin/' + ls, body(ls, item, pos));
        for (var k = 0; k < arr.length; k++) {
          var x = arr[k]; if (x === item || x.id == null || Number(x.order) === k + 1) continue;
          await api('PUT', '/admin/' + ls + '/' + encodeURIComponent(x.id), body(ls, x, k));
        }
        await load(false); leave();
      }, 'Tersimpan');
    }
    else if (act === 'del-form') {
      var g = S.form, di = S[g.list][g.i];
      if (!di || !confirm('Hapus item ini?')) return;
      run(async function () { await api('DELETE', '/admin/' + g.list + '/' + encodeURIComponent(di.id)); await load(false); leave(); }, 'Dihapus');
    }
    else if (act === 'push-all') {
      if (!confirm('Timpa semua konten di server dengan isi panel ini?')) return;
      run(async function () {
        await api('PUT', '/admin/content', { settings: S.settings, links: clean(S.links, 'links'), portfolio: clean(S.portfolio, 'portfolio') });
        await load(false);
      }, 'Semua konten dikirim');
    }
    else if (act === 'dl-json') {
      download(JSON.stringify({ settings: S.settings, links: S.links, portfolio: S.portfolio, donations: S.donations }, null, 2), 'vylonium-content.json');
      toast('Cadangan diunduh');
    }
  });

  /* ---------- Boot ---------- */
  S.base = fetchStored(K_BASE) || DEFAULT_BASE;
  S.token = fetchStored(K_TOKEN);
  try { S.remember = !!localStorage.getItem(K_TOKEN) || !sessionStorage.getItem(K_TOKEN); } catch (e) {}
  render();
  if (S.token) run(function () { return load(false); });
})();
</script>
</body>
</html>
